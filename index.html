<!--
    CSS functions:
    1. var(): Sử dụng biến CSS
    2. calc(): Tính toán giá trị CSS
    3. rgb(), rgba(): Màu sắc theo hệ RGB
    4. linear-gradient(): Tạo màu gradient
    5. calc(): Tính toán giá trị CSS
    6. attr(): Lấy giá trị thuộc tính của phần tử
-->

<!--
    CSS pseudo-classes:
    :root - Đại diện cho phần tử gốc của tài liệu
    :hover - Khi di chuột vào phần tử
    :active - Khi phần tử được kích hoạt (nhấn chuột)
    :first-child - Phần tử con đầu tiên của phần tử cha
    :last-child - Phần tử con cuối cùng của phần tử cha
-->

<!--
    CSS pseudo-elements:
    ::before - Chèn nội dung trước nội dung của phần tử
    ::after - Chèn nội dung sau nội dung của phần tử
    ::first-letter - Chọn chữ cái đầu tiên của phần tử
    ::first-line - Chọn dòng đầu tiên của phần tử
    ::selection - Chọn phần nội dung được chọn của phần tử
-->

<!--
    Postion:
    relative - Vị trí tương đối: di chuyển so với vị trí ban đầu
    absolute - Vị trí tuyệt đối: di chuyển so với phần tử cha gần nhất có position khác static
    fixed - Vị trí cố định: di chuyển so với cửa sổ trình duyệt
    sticky - Vị trí dính: kết hợp giữa relative và fixed
-->
